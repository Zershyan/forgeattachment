import java.nio.file.Files
import java.nio.file.StandardCopyOption

buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = mod_group_id

// 包内版本号恒带 +build.<编号>，只有 buildAlpha 会把这个编号也写进 jar 文件名
def isAlphaBuild = gradle.startParameter.taskNames.any { it.endsWith('buildAlpha') }
def baseVersion = "${mod_version}-${minecraft_version}"
version = "${baseVersion}+build.${mod_build_number}"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        // ForgeGradle 按运行名推断类型（client / server / data / gameTestServer），无需显式声明
        client1 {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory(file('run/client1'))
            args("--username", "player1")
        }

        client2 {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory(file('run/client2'))
            args("--username", "player2")
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory(file('run/server'))
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory(file('run/gameTestServer'))
        }

        data {
            workingDirectory(file('run-data'))
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }

        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel") // BlockBench 工程文件
    exclude("**/.cache/**") // datagen 缓存
}

repositories {
    mavenLocal()
    flatDir {
        dir 'libs'
    }
    maven { // TOP
        url "https://cursemaven.com"
    }
    maven { // mirror
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = "https://maven.enjarai.dev/mirrors" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly("org.spongepowered:mixin:0.8.5")
    compileOnly(fileTree("libs/compileOnly"))
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_credits            : mod_credits,
            mod_url                : mod_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    // 模板里有中文注释，默认按平台编码读会写成乱码
    filteringCharset = 'UTF-8'
    from "src/main/templates"
    include 'META-INF/**'
    into "build/generated/sources/modMetadata"
}

// 构建期开关：把 gradle.properties 的值展开进常量类
var generateStartupConfig = tasks.register("generateStartupConfig", ProcessResources) {
    var replaceProperties = [enable_example: enable_example]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates/java"
    into "build/generated/sources/startupConfig"
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.java.srcDir generateStartupConfig

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

// 打包收尾：最终包改名到 libs 顶层，原包（带编号）挪进 libs/origin
tasks.register('finalizeArtifacts') {
    group = 'build'
    description = '整理 build/libs：最终包改名，原包挪进 origin 子目录'
    def libsDir = layout.buildDirectory.dir('libs').get().asFile
    def modId = mod_id
    def modVersion = version
    def releaseVersion = isAlphaBuild ? version : baseVersion
    doLast {
        def builtJar = new File(libsDir, "${modId}-${modVersion}.jar")
        def backupJar = new File(new File(libsDir, 'origin'), "${modId}-${modVersion}-origin.jar")
        if (releaseVersion != modVersion) {
            // 最终包与原包内容一致，只是名字不带编号；原包上一轮可能已搬进 origin，就从那里取
            def source = builtJar.exists() ? builtJar : backupJar
            if (source.exists()) {
                Files.copy(source.toPath(), new File(libsDir, "${modId}-${releaseVersion}.jar").toPath(), StandardCopyOption.REPLACE_EXISTING)
                if (source == builtJar) {
                    backupJar.parentFile.mkdirs()
                    Files.move(builtJar.toPath(), backupJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
            }
        } else if (!builtJar.exists() && backupJar.exists()) {
            // buildAlpha 的最终包与原包同名，把上一轮搬走的原包取回来
            Files.copy(backupJar.toPath(), builtJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('build') { finalizedBy 'finalizeArtifacts' }

// 与 build 完全相同，只是版本号会带上 +build.<编号>
tasks.register('buildAlpha') {
    group = 'build'
    description = '打成 alpha 包，产物版本号带 +build.<编号>'
    dependsOn 'build'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}