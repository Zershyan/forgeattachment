buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
archivesBaseName = mod_id
version = "${mod_version}-${minecraft_version}"

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = "${minecraft_version}-${forge_version}"
    runDir = 'run'
    mappings = mappings_version
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    // 1.12.2 后期版本的 Forge 自带 Mixin；显式引入让开发环境也能找到 MixinTweaker。
    // 必须排除传递依赖：Mixin 会带进较新的 log4j，与 1.12.2 自带的 2.8.1 冲突。
    compile("org.spongepowered:mixin:${mixin_version}") {
        transitive = false
    }
    annotationProcessor "org.spongepowered:mixin:${mixin_version}"
}

mixin {
    // 生成 refmap 并打进 jar，注入点可用 MCP 名定位
    add sourceSets.main, "${mod_id}.refmap.json"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
                'MixinConfigs': "${mod_id}.mixins.json",
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                'TweakOrder': '0',
                'FMLCorePlugin': "${mod_group_id}.${mod_id}.MixinLoader",
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
}

// 开发环境的 tweaker 由 MixinGradle 接管；0.6 在 FG 2.x 上不自动注入，这里补一条
afterEvaluate {
    tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.all { task ->
        task.args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'
    }
}
