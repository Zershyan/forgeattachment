import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = mod_group_id

// 包内版本号恒带 +build.<编号>，只有 buildAlpha 会把这个编号也写进 jar 文件名
def isAlphaBuild = gradle.startParameter.taskNames.any { it.endsWith('buildAlpha') }
// buildAlpha 用 +1 后的编号构建，成功后把同一编号写回 gradle.properties，
// 使产物里的编号与 properties 始终一致
def buildNumber = mod_build_number.toInteger() + (isAlphaBuild ? 1 : 0)
def baseVersion = "${mod_version}-${minecraft_version}"
version = "${baseVersion}+build.${buildNumber}"

// Forge 1.20.1 使用 Java 17
java {
    withSourcesJar()
    withJavadocJar()
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

base {
    archivesName = mod_id
}

repositories {
    mavenLocal()
    flatDir {
        dir 'libs'
    }
    maven { // CurseForge 依赖
        url "https://cursemaven.com"
    }
    maven { // 依赖镜像
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = "https://maven.enjarai.dev/mirrors" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    mixin {
        add sourceSets.main, "${mod_id}.refmap.json"
        config "${mod_id}.mixins.json"
    }

    runs {
        client1 {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('./run/client1')
            programArguments.addAll("--username", "player1")
        }

        client2 {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('./run/client2')
            programArguments.addAll("--username", "player2")
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("**/.cache/**")
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // mixin refmap：Forge 1.20.1 必须由注解处理器生成
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 构建期开关：把 gradle.properties 的值展开进常量类
var generateStartupConfig = tasks.register("generateStartupConfig", ProcessResources) {
    var replaceProperties = [enable_example: enable_example]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates/java"
    into "build/generated/sources/startupConfig"
}

sourceSets.main.java.srcDir generateStartupConfig

// mods.toml 占位符展开（Forge 的元数据直接在 resources 下，不走 templates 目录）
var modMetadataProps = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        // 包内版本号恒带 +build.<编号>，用 gradle 的 version 而非 mod_version
        mod_version            : version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        mod_credits            : mod_credits,
        mod_url                : mod_url,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties modMetadataProps
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand modMetadataProps
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar).configure {
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
}

javadoc {
    options.encoding = 'UTF-8'
    // 中文注释与跨模块 @link 会产生警告，不能因此中断发布
    failOnError = false
}

// 未经重混淆的产物，供下游 mod 在开发环境引用
tasks.register('deobfJar', Jar) {
    from(sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }
    dependsOn classes
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact deobfJar
            artifact javadocJar
            artifact sourcesJar

            groupId = project.group
            artifactId = mod_id
            version = project.version
            pom {
                name = mod_id
                description = mod_description
                if (mod_url) {
                    url = mod_url
                }
                licenses {
                    license {
                        name = mod_license
                    }
                }
                developers {
                    developer {
                        id = mod_id
                        name = mod_authors
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'MafuyuNexus'
            url = 'https://maven.sighs.cc/repository/maven-releases/'
            credentials {
                username = System.getenv('MafuyuNexusUsername') ?: ''
                password = System.getenv('MafuyuNexusPassword') ?: ''
            }
        }
    }
}

// 打包收尾：最终包改名到 libs 顶层，原包（带编号）挪进 libs/origin
tasks.register('finalizeArtifacts') {
    group = 'build'
    description = '整理 build/libs：最终包改名，原包挪进 origin 子目录'
    def libsDir = layout.buildDirectory.dir('libs').get().asFile
    def modId = mod_id
    def modVersion = version
    def releaseVersion = isAlphaBuild ? version : baseVersion
    doLast {
        def builtJar = new File(libsDir, "${modId}-${modVersion}.jar")
        def backupJar = new File(new File(libsDir, 'origin'), "${modId}-${modVersion}-origin.jar")
        if (releaseVersion != modVersion) {
            // 最终包与原包内容一致，只是名字不带编号；原包上一轮可能已搬进 origin，就从那里取
            def source = builtJar.exists() ? builtJar : backupJar
            if (source.exists()) {
                Files.copy(source.toPath(), new File(libsDir, "${modId}-${releaseVersion}.jar").toPath(), StandardCopyOption.REPLACE_EXISTING)
                if (source == builtJar) {
                    backupJar.parentFile.mkdirs()
                    Files.move(builtJar.toPath(), backupJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
            }
        } else if (!builtJar.exists() && backupJar.exists()) {
            // buildAlpha 的最终包与原包同名，把上一轮搬走的原包取回来
            Files.copy(backupJar.toPath(), builtJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('build') { finalizedBy 'finalizeArtifacts' }

// 与 build 完全相同，只是编号 +1 并把该编号同步回 gradle.properties
tasks.register('buildAlpha') {
    group = 'build'
    description = '打成 alpha 包，产物版本号带 +build.<编号>，构建成功后把该编号同步回 gradle.properties'
    dependsOn 'build'
    def propsFile = layout.projectDirectory.file('gradle.properties').asFile
    def buildNumberBefore = mod_build_number
    def buildNumberUsed = buildNumber
    doLast {
        def text = propsFile.getText('UTF-8')
        def matcher = (text =~ '(?m)^mod_build_number=\\s*(\\d+)\\s*$')
        if (!matcher.find()) {
            logger.warn('mod_build_number not found in gradle.properties, skipped sync')
            return
        }
        propsFile.setText(
                text.replaceFirst('(?m)^mod_build_number=\\s*\\d+\\s*$', "mod_build_number=${buildNumberUsed}"),
                'UTF-8')
        logger.lifecycle("mod_build_number synced: ${buildNumberBefore} -> ${buildNumberUsed}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
